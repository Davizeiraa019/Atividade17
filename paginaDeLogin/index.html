<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>

<body>
    <header>
        <h1>Bem-vindo à TechStore Brasil</h1>
        <h2>Acesse sua conta e fique por dentro das melhores ofertas em tecnologia.</h2>
    </header>
    <nav class="navenovo">

        <a href="../index.html" class="logo_site">
            <img src="../img/logosite.png" alt="Logo TechStore">
            <span>TechStore</span>
        </a>

        <div class="nav-links">
            <a href="../paginaDeRecuperacaoDeSenha/index.html" class="btn btn-outline-primary">Esqueci minha senha</a>
        </div>

        <a href="../paginaDeCadastro/index.html" class="btn btn-outline-primary">Cadastre-se</a>

    </nav>
    <main>
        <section>
            <img src="../img/login.png" alt="Imagem para o login" width="600" height="400">
        </section>
        <form action="../index.html">
            <label>E-mail</label>
            <input type="email" placeholder="Digite seu e-mail">


            <label>Senha</label>
            <input type="password" placeholder="Digite sua senha">


            <button type="button" class="btn btn-info">Entrar</button>

        </form>
    </main>
    <footer>
        <p>&copy; 2026 TechStore Brasil. Todos os direitos reservados.</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
